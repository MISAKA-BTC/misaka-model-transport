[package]
name = "misaka-model-transport-app"
description = "MISAKA Model Transport: the desktop app over misaka-torrentd (RFC-0001 §7.3)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MISAKA-BTC/misaka-model-transport"
rust-version = "1.85"
publish = false

# The app is its own workspace: it needs a GUI toolkit (WebKit on Linux) that the transport crates
# must never depend on, and `cargo test --workspace` at the root stays headless.
[workspace]

[lib]
name = "misaka_model_transport_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
libc = "0.2"
misaka-bundle = { path = "../../crates/misaka-bundle" }
misaka-btv2 = { path = "../../crates/misaka-btv2" }
misaka-transport-ipc = { path = "../../crates/misaka-transport-ipc" }

[profile.release]
overflow-checks = true
codegen-units = 1
lto = true
strip = true
