# RFC-0002 P1 measurement router "seed" (not for production use).
log = file
logfile = /var/lib/misaka-i2pd-seed/i2pd.log
loglevel = warn
ipv4 = true
ipv6 = true
port = 24601
bandwidth = 4096
share = 100
notransit = false
floodfill = false
certsdir = /opt/misaka-torrent/i2pd/certificates
tunconf = /var/lib/misaka-i2pd-seed/tunnels.conf
[http]
enabled = true
address = 127.0.0.1
port = 7070
[httpproxy]
enabled = false
[socksproxy]
enabled = false
[sam]
enabled = true
address = 127.0.0.1
port = 7656
[bob]
enabled = false
[i2cp]
enabled = false
[i2pcontrol]
enabled = false
[upnp]
enabled = false
[reseed]
verify = true
