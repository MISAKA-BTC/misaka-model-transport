# systemd-sysusers: the daemon's own account, and the group kaspad reads the store through.
# Equivalent to misakas setup's `useradd --system … --shell /usr/sbin/nologin`.
g misaka_models -
u misaka_torrent - "MISAKA Torrent daemon" /var/lib/misaka-torrent /usr/sbin/nologin
m misaka_torrent misaka_models
# Add kaspad's account to the group, never to misaka_torrent's:
# m misaka_user misaka_models
